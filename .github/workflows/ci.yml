name: CI

on:
  push:
    branches: [main, next]
  pull_request:
    branches: [main, next]

jobs:
  test:
    name: Test (Go ${{ matrix.go }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 1.20 is the minimum declared in go.mod; oldstable/stable are the two
        # Go releases currently supported upstream.
        go: ["1.20", "oldstable", "stable"]
        os: [ubuntu-latest]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go }}
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race -count=1 -coverprofile=coverage.out ./...

      - name: Upload coverage
        if: matrix.go == 'stable' && matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out
          retention-days: 7

  # The SDK has no platform-specific code, so macOS adds little over Linux,
  # while macOS runners often queue for a long time. Run it only on pushes to
  # main (i.e. before a release) instead of on every pull request.
  test-macos:
    name: Test (Go stable / macos-latest)
    runs-on: macos-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Test (race)
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15.0

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  smoke:
    name: Smoke test (live API)
    runs-on: ubuntu-latest
    # Only run on push to main when the secret is available.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - name: Run smoke tests
        env:
          OCTA_API_KEY: ${{ secrets.OCTA_API_KEY }}
        run: |
          if [ -z "$OCTA_API_KEY" ]; then
            echo "OCTA_API_KEY secret not set — skipping live smoke test"
            exit 0
          fi
          go run ./cmd/smoke -json
